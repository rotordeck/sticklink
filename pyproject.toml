[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sticklink"
dynamic = ["version"]
description = "Live stick and telemetry overlays for OBS, from an EdgeTX radio (RadioMaster Pocket)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.10,<4", "pyserial>=3.5,<4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Multimedia :: Video",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]

[project.optional-dependencies]
dev = ["openapi-spec-validator>=0.7", "build>=1.2"]
binary = ["pyinstaller>=6.10"]

[project.urls]
Repository = "https://github.com/rotordeck/sticklink"

[project.scripts]
sticklink = "sticklink.cli:main"

[tool.setuptools.dynamic]
version = {attr = "sticklink.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sticklink = ["web/*", "web/fonts/*", "web/swagger/*", "web/fonts/LICENSES/*", "web/themes/*/*", "radio/*"]
