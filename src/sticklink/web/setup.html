<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sticklink · Setup</title>
  <link rel="icon" href="/assets/icon.svg">
  <link rel="stylesheet" href="/assets/brand.css">
  <style>
    main{max-width:1000px;margin:0 auto;padding:16px}
    h2{margin:18px 0 6px}
    #conn{color:var(--primary);font:11px var(--mono);letter-spacing:1px}#saved{margin-left:auto;color:var(--primary);font-size:12px}
    #banner{margin:10px 0;padding:10px 12px;border-radius:var(--radius);background:#2a2410;border:1px solid var(--wait);color:#f3d889}
    .cols{display:flex;gap:24px;flex-wrap:wrap;margin-top:12px}.col{flex:1 1 380px;min-width:300px}
    canvas{width:100%;max-width:380px;background:var(--base);border-radius:var(--radius);border:1px solid var(--border)}
    .row{display:grid;grid-template-columns:84px minmax(150px,1fr) auto auto;gap:6px 10px;align-items:center;margin:6px 0}
    .row .meter{grid-column:2 / -1}.row b{font:11px var(--mono);letter-spacing:1px;text-transform:uppercase}
    select,button{padding:4px 8px}
    .meter{position:relative;height:8px;border-radius:var(--radius);background:var(--input);overflow:hidden}
    .meter i{position:absolute;top:0;bottom:0;background:var(--primary)}
    .bar{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;margin:4px 0;font-size:12px}
    .bar em{font-style:normal;text-align:right;color:var(--muted)}#bars{margin-top:10px;max-width:380px}
    #mon{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 24px}
    .lamps{display:flex;gap:8px;margin:8px 0}.lamp{padding:3px 10px;border-radius:var(--radius);border:1px solid var(--border);color:var(--muted);font:11px var(--mono);letter-spacing:1px}
    .lamp.on{background:#2a2410;border-color:var(--wait);color:var(--wait)}.lamp.off{opacity:.4}
    .hint{color:var(--muted);font-size:12px;margin:8px 0}.mode{display:flex;gap:8px;align-items:center;margin-top:8px}
  </style>
  <script type="module" src="/assets/setup.js"></script>
</head>
<body></body>
</html>
