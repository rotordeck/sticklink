<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sticklink · Modes</title>
  <link rel="icon" href="/assets/icon.svg">
  <link rel="stylesheet" href="/assets/brand.css">
  <style>
    :root{--yellow:var(--primary);--bg:var(--window);--card:var(--base);--head:var(--input);--line:var(--border)}
        main{max-width:1060px;margin:0 auto;padding:14px 16px 60px}
        #status{margin-left:auto;color:var(--ok);font-size:12px}#status.bad{color:var(--bad)}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin:12px 0}
    .obsline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.dot{width:11px;height:11px;border-radius:50%;background:var(--muted);display:inline-block}
    .dot.connected{background:var(--ok);box-shadow:0 0 6px var(--ok)}.dot.connecting{background:var(--wait)}.dot.unreachable,.dot.auth_failed,.dot.error{background:var(--bad)}
    #conn{margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;align-items:end}#conn label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
    #conn .hint{flex-basis:100%;color:var(--muted);font-size:12px}
    .btn.small{padding:3px 10px;font-size:13px}.btn.tiny{padding:0 6px;font-size:11px}
    .btn.x{font-size:18px;line-height:1;padding:0 8px}
    .switch{display:flex;align-items:center;gap:8px;font-size:15px}.switch input{width:18px;height:18px;accent-color:var(--yellow)}
    .warn{margin:6px 0;color:var(--wait);font-size:12.5px}#engine{margin:4px 0 8px;font-size:13px}#engine.live{color:var(--ok)}#engine.blocked{color:var(--wait)}
    .opts{display:flex;gap:18px;flex-wrap:wrap;align-items:center}.opts label{display:flex;gap:6px;align-items:center}
    .info{border:1px solid var(--wait);background:#2a2410;border-radius:var(--radius);padding:10px 14px;margin:12px 0;font-size:13px}
    #banner{margin:8px 0;padding:8px 12px;background:#2a2410;border:1px solid var(--wait);border-radius:var(--radius);color:var(--wait)}
    .check.hide{display:flex;align-items:center;gap:8px;margin:14px 0 8px}.check input{accent-color:var(--yellow)}
    .card{display:grid;grid-template-columns:230px 1fr;background:var(--card);border-bottom:6px solid var(--bg);margin-bottom:0}
    .card.active{box-shadow:inset 4px 0 0 var(--yellow)}.card.active .name{color:var(--text)}
    .head{background:var(--head);padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
    .name{font-weight:700;letter-spacing:.5px;text-transform:uppercase;overflow-wrap:anywhere}.card.unused .name{color:var(--muted)}
    .tag{margin-left:6px;font-size:10px;background:var(--bad);color:var(--text);border-radius:var(--radius);padding:1px 5px;text-transform:none}
    .prio{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:12px}.prio .num{margin-right:4px}
    .grip{cursor:grab;user-select:none;touch-action:none;margin-left:auto;padding:2px 6px;border:1px dashed var(--muted);border-radius:var(--radius);font-size:11px}.grip:active{cursor:grabbing}
    .winner{font-size:11px;color:var(--yellow);font-weight:700;min-height:14px}.card.selected{box-shadow:inset 4px 0 0 var(--yellow)}
    .card.dragging{opacity:.55}.card.drop-before{box-shadow:0 -4px 0 0 var(--yellow)}.card.drop-after{box-shadow:0 4px 0 0 var(--yellow)}
    .ranges{padding:8px 14px;display:flex;flex-direction:column;gap:10px;justify-content:center;min-height:40px}
    .row{display:grid;grid-template-columns:90px 1fr auto auto;gap:12px;align-items:center}
    .slider{padding:0 14px}.track{position:relative;height:22px;background:var(--input);border:1px solid var(--border);box-sizing:border-box;border-radius:11px;touch-action:none;cursor:pointer}
    .fill{position:absolute;top:0;bottom:0;background:var(--yellow);opacity:.75;pointer-events:none}.fill.on{opacity:1;box-shadow:0 0 8px var(--yellow)}
    .handle{position:absolute;top:-2px;width:20px;height:26px;margin-left:-10px;background:var(--text);border:2px solid var(--muted);border-radius:var(--radius);cursor:ew-resize;box-sizing:border-box;touch-action:none;
      background-image:linear-gradient(90deg,transparent 7px,#777 7px,#777 9px,transparent 9px,transparent 11px,#777 11px,#777 13px,transparent 13px)}
    .handle:focus-visible,.handle.drag{outline:2px solid var(--text);border-color:var(--yellow)}
    .marker{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--wait);border:1px solid var(--text);pointer-events:none;z-index:2}
    .ticks{position:relative;height:16px;margin-top:6px;color:var(--muted);font-size:11px}.tick{position:absolute;transform:translateX(-50%)}
    .vals{color:var(--muted);font-size:12px;margin-top:2px}
    .empty{padding:24px;text-align:center;color:var(--muted)}
    @media (max-width:720px){.card{grid-template-columns:1fr}.row{grid-template-columns:80px 1fr}}
  </style>
  <script type="module" src="/assets/modes.js"></script>
</head>
<body></body>
</html>
