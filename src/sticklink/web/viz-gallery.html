<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticklink visualisers</title>
<style>
  :root { --bg: #11151c; --card: #1a212c; --text: #e6edf3; --muted: #8b98a9; --accent: #4cc9f0; --bad: #ff6b6b; }
  @media (prefers-color-scheme: light) { :root { --bg: #f3f5f8; --card: #fff; --text: #14202e; --muted: #5b6b7e; --accent: #0b6fa4; --bad: #b3261e; } }
  body { margin: 0; padding: 20px 16px 40px; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; } p.lead { color: var(--muted); margin: 0 0 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .card { background: var(--card); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .preview { aspect-ratio: 16 / 9; background: #000; position: relative; }
  .preview iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .body { padding: 10px 12px 12px; display: grid; gap: 4px; }
  .name { font-weight: 600; } .meta { color: var(--muted); font-size: 13px; } .err { color: var(--bad); font-size: 13px; }
  .row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  a.btn, button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--accent); color: var(--accent); background: transparent; text-decoration: none; cursor: pointer; }
  a.btn.primary { background: var(--accent); color: #000; }
  code { background: rgba(127,127,127,.18); padding: 1px 5px; border-radius: 4px; }
  .empty { color: var(--muted); }
</style>
<main>
  <h1>Visualisers</h1>
  <p class="lead">Add one as an OBS Browser Source with its address (the Copy button). Put your own in <code id="dir">the plugins folder</code>, or run <code>sticklink plugin install FILE</code>.
    <a href="https://github.com/rotordeck/sticklink/blob/main/docs/plugins.md" style="color:var(--accent)">How to write one</a>.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
  const grid = document.getElementById('grid');
  fetch('/api/v1/plugins').then((r) => r.json()).then(({ plugins }) => {
    if (!plugins.length) { grid.innerHTML = '<p class="empty">No visualisers installed.</p>'; return; }
    for (const p of plugins) {
      const url = location.origin + p.url;
      const card = document.createElement('div'); card.className = 'card';
      const preview = document.createElement('div'); preview.className = 'preview';
      if (!p.error) { const f = document.createElement('iframe'); f.loading = 'lazy'; f.src = p.url; preview.append(f); }
      const body = document.createElement('div'); body.className = 'body';
      const name = document.createElement('div'); name.className = 'name'; name.textContent = p.name;
      const meta = document.createElement('div'); meta.className = 'meta';
      meta.textContent = [p.author && 'by ' + p.author, p.version && 'v' + p.version, p.builtin ? 'built in' : 'yours'].filter(Boolean).join(' · ');
      const desc = document.createElement('div'); desc.className = 'meta'; desc.textContent = p.description;
      body.append(name, meta, desc);
      if (p.error) { const e = document.createElement('div'); e.className = 'err'; e.textContent = 'Cannot run: ' + p.error; body.append(e); }
      else {
        const row = document.createElement('div'); row.className = 'row';
        const open = document.createElement('a'); open.className = 'btn primary'; open.href = p.url; open.target = '_blank'; open.textContent = 'Open';
        const copy = document.createElement('button'); copy.textContent = 'Copy address';
        copy.onclick = () => { navigator.clipboard.writeText(url).then(() => { copy.textContent = 'Copied'; setTimeout(() => (copy.textContent = 'Copy address'), 1500); }, () => prompt('Address:', url)); };
        row.append(open, copy); body.append(row);
      }
      card.append(preview, body); grid.append(card);
    }
  });
</script>
