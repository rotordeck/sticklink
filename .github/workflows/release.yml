name: Release

# Tag a version (git tag v0.1.0 && git push origin v0.1.0) to build and publish a release.
# "Run workflow" by hand builds everything and keeps it as workflow artifacts without publishing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-package:
    name: Python wheel and source package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r\"__version__ = '([^']+)'\", pathlib.Path('src/sticklink/__init__.py').read_text()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $version"; exit 1
          fi
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  binaries:
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: linux-x86_64, exe: sticklink, format: gztar}
          - {os: windows-2022, target: windows-x86_64, exe: sticklink.exe, format: zip}
          - {os: macos-15, target: macos-arm64, exe: sticklink, format: gztar}
          - {os: macos-15-intel, target: macos-x86_64, exe: sticklink, format: gztar}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install non-editable, so PyInstaller can collect the package data files
        run: python -m pip install ".[binary]"
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/sticklink.spec
      - name: Smoke test the program
        run: python packaging/smoke_test.py dist/${{ matrix.exe }}
      - name: Package
        shell: python
        run: |
          import os, pathlib, shutil, sticklink
          name = f"sticklink-{sticklink.__version__}-${{ matrix.target }}"
          stage = pathlib.Path("stage") / name
          stage.mkdir(parents=True)
          shutil.copy2("dist/${{ matrix.exe }}", stage / "${{ matrix.exe }}")
          shutil.copy2("src/sticklink/radio/DDSTK.lua", stage / "DDSTK.lua")
          for f in ("README.md", "THIRD_PARTY_NOTICES.md", "CHANGELOG.md"):
              shutil.copy2(f, stage / f)
          shutil.copytree("docs", stage / "docs")
          archive = shutil.make_archive(name, "${{ matrix.format }}", "stage", name)  # keeps the executable bit on Linux/macOS
          print("built", archive)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"ARCHIVE={archive}\n")
      - uses: actions/upload-artifact@v7
        with:
          name: sticklink-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-package, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Sticklink $version" > notes.md; fi
          cat >> notes.md <<'EOF'

          ## Downloads
          - `sticklink-<version>-<system>.(tar.gz|zip)`: one self-contained program (Python included), the radio script `DDSTK.lua`, README and docs.
          - `sticklink-<version>-py3-none-any.whl` and the source package: the Python version (`pip install`).
          - `SHA256SUMS.txt`: checksums of everything above.

          The programs are not code-signed: on macOS clear the quarantine flag (`xattr -d com.apple.quarantine ./sticklink`), on Windows choose *More info, Run anyway*.
          See `docs/getting-started.md` inside the archive.
          EOF
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* --title "Sticklink ${GITHUB_REF_NAME#v}" --notes-file notes.md $flags

  pypi:
    name: Publish to PyPI (uvx / pip)
    # After the GitHub release, because a PyPI upload can never be replaced. Needs the one-time
    # trusted-publisher setup described in docs/development.md. Pre-release tags (v1.0.0-rc1) are skipped.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: [publish]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sticklink/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
