name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v

  overlay:
    name: Overlay (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fx
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fx/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Committed bundles are up to date
        run: |
          npm run build
          git diff --exit-code -- ../src/sticklink/web/stickfx.js ../src/sticklink/web/setup.js

  radio-script:
    name: Radio script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: luac5.3 -p src/sticklink/radio/DDSTK.lua
